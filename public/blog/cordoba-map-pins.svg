<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Mapa de Córdoba con pins en Casco Histórico, Ciudad Jardín, El Brillante, Parque Figueroa, Fátima y Levante">
  <rect width="800" height="500" fill="#0F1117"/>
  <rect x="40" y="40" width="720" height="420" rx="16" fill="#1a1d24" stroke="#2a2e38"/>
  <path d="M120 320 Q 200 220 320 250 T 560 200 Q 660 220 680 320 Q 600 400 420 380 Q 240 400 120 320 Z" fill="#222630" stroke="#3a3f4b" stroke-width="2"/>
  <path d="M150 330 Q 280 280 420 300 T 660 290" stroke="#3a4150" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M300 200 L 320 380" stroke="#3a4150" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M500 210 L 480 390" stroke="#3a4150" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Córdoba — barrios con más demanda local</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#ffffff">
    <g transform="translate(330,330)">
      <circle r="11" fill="#E8560A"/>
      <circle r="4" fill="#ffffff"/>
      <text x="18" y="4">Casco Histórico</text>
    </g>
    <g transform="translate(450,260)">
      <circle r="11" fill="#E8560A"/>
      <circle r="4" fill="#ffffff"/>
      <text x="18" y="4">Ciudad Jardín</text>
    </g>
    <g transform="translate(560,230)">
      <circle r="11" fill="#E8560A"/>
      <circle r="4" fill="#ffffff"/>
      <text x="18" y="4">El Brillante</text>
    </g>
    <g transform="translate(220,260)">
      <circle r="11" fill="#E8560A"/>
      <circle r="4" fill="#ffffff"/>
      <text x="-90" y="4">Parque Figueroa</text>
    </g>
    <g transform="translate(280,380)">
      <circle r="11" fill="#E8560A"/>
      <circle r="4" fill="#ffffff"/>
      <text x="18" y="4">Fátima</text>
    </g>
    <g transform="translate(620,360)">
      <circle r="11" fill="#E8560A"/>
      <circle r="4" fill="#ffffff"/>
      <text x="18" y="4">Levante</text>
    </g>
  </g>
</svg>
